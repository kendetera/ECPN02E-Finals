name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Build the React app here so the small EC2 server does not have to.
      - name: Build client
        run: npm run build

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "server,client/dist,package.json,package-lock.json,ecosystem.config.cjs"
          target: "~/ElectiveFinals"
          rm: false

      - name: Install and restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/ElectiveFinals
            npm ci --omit=dev
            pm2 startOrReload ecosystem.config.cjs
            pm2 save
            # Give the app up to 30 s to start listening before checking it.
            for i in $(seq 1 15); do
              if curl -fsS http://localhost:3000/api/health; then echo; echo "Deploy OK"; exit 0; fi
              sleep 2
            done
            echo "App did not answer on port 3000. Recent logs:"
            pm2 logs ElectiveFinals --lines 40 --nostream
            exit 1
